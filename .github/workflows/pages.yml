name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 环境信息
        run: node --version && npm --version
      - name: 语法与模块自检
        run: node tools/check.mjs
      - name: 页面与资源自检
        run: node tools/site-check.mjs
      - name: 工具逻辑验证
        run: node tools/logic-verify.mjs
      - name: 路由联动测试
        run: node tools/router-test.mjs assets/js/core/router.js
      - name: 二维码编解码验证
        run: node tools/qr-verify.mjs && node tools/qr-rs-check.mjs && node tools/qr-robust.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
